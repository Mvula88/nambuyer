<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #111; }
  .canvas {
    width: 800px; height: 800px;
    background: #ffffff;
    position: relative;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .logo-icon {
    width: 520px;
    height: auto;
    position: relative;
    z-index: 1;
  }
  .tagline {
    font-size: 24px;
    color: #1e3a5f;
    font-weight: 700;
    margin-top: 28px;
    letter-spacing: 4px;
    text-transform: uppercase;
    position: relative;
    z-index: 1;
  }
</style>
</head>
<body>
<div class="canvas">
  <img src="/logo.png" class="logo-icon" alt="NamBuyer">
  <div class="tagline">We Buy Cars For Cash</div>
</div>
<button onclick="downloadDesign()" style="position:fixed;top:20px;right:20px;background:#3b82f6;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;z-index:999;">Download PNG</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
function downloadDesign(){
  const el = document.querySelector('.canvas');
  html2canvas(el, {scale:1, backgroundColor:'#ffffff', useCORS:true}).then(c => {
    const a = document.createElement('a');
    a.download = 'nambuyer-facebook-profile.png';
    a.href = c.toDataURL('image/png');
    a.click();
  });
}
</script>
</body>
</html>
