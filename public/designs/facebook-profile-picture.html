<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #111; }
  .canvas {
    width: 800px; height: 800px;
    background: #0a0f1a;
    position: relative;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .canvas::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(59,130,246,0.06) 0%, transparent 70%);
  }
  .corner-tl {
    position: absolute;
    top: 0; left: 0;
    width: 100px; height: 100px;
    border-top: 3px solid #1e3a5f;
    border-left: 3px solid #1e3a5f;
  }
  .corner-br {
    position: absolute;
    bottom: 0; right: 0;
    width: 100px; height: 100px;
    border-bottom: 3px solid #C5A55A;
    border-right: 3px solid #C5A55A;
  }
  .logo-icon {
    width: 420px;
    height: auto;
    position: relative;
    z-index: 1;
  }
  .tagline {
    font-size: 18px;
    color: rgba(255,255,255,0.3);
    font-weight: 600;
    margin-top: 20px;
    letter-spacing: 3px;
    text-transform: uppercase;
    position: relative;
    z-index: 1;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="corner-tl"></div>
  <div class="corner-br"></div>
  <img src="/logo.png" class="logo-icon" alt="NamBuyer" style="filter: brightness(0) invert(1);">
  <div class="tagline">We Buy Cars For Cash</div>
</div>
<button onclick="downloadDesign()" style="position:fixed;top:20px;right:20px;background:#3b82f6;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;z-index:999;">Download PNG</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
function downloadDesign(){
  const el = document.querySelector('.canvas');
  html2canvas(el, {scale:1, backgroundColor:null, useCORS:true}).then(c => {
    const a = document.createElement('a');
    a.download = 'nambuyer-facebook-profile.png';
    a.href = c.toDataURL('image/png');
    a.click();
  });
}
</script>
</body>
</html>
