<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #111; }
  .canvas {
    width: 820px; height: 312px;
    background: #0a0f1a;
    position: relative;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
  }
  /* Subtle blue glow right side */
  .canvas::after {
    content: '';
    position: absolute;
    right: -100px;
    top: -100px;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(59,130,246,0.1) 0%, transparent 70%);
  }
  .left {
    flex: 1;
    padding: 40px 48px;
    position: relative;
    z-index: 1;
  }
  h1 {
    font-size: 42px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.08;
    letter-spacing: -1px;
  }
  h1 span { color: #3b82f6; }
  .subtext {
    font-size: 14px;
    color: rgba(255,255,255,0.4);
    margin-top: 12px;
    line-height: 1.5;
    max-width: 360px;
  }
  .pills {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }
  .pill {
    background: rgba(59,130,246,0.1);
    border: 1px solid rgba(59,130,246,0.2);
    color: rgba(255,255,255,0.7);
    font-size: 11px;
    font-weight: 600;
    padding: 5px 14px;
    border-radius: 20px;
  }
  .right-side {
    width: 280px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    position: relative;
    z-index: 1;
    padding: 32px;
  }
  .right-side::before {
    content: '';
    position: absolute;
    left: 0;
    top: 40px;
    bottom: 40px;
    width: 1px;
    background: rgba(255,255,255,0.06);
  }
  .right-big {
    font-size: 48px;
    font-weight: 900;
    color: #3b82f6;
    line-height: 1;
    letter-spacing: -1px;
  }
  .right-label {
    font-size: 13px;
    color: rgba(255,255,255,0.35);
    margin-top: 8px;
    font-weight: 600;
  }
  .website {
    position: absolute;
    bottom: 12px;
    right: 20px;
    font-size: 10px;
    color: rgba(255,255,255,0.2);
    font-weight: 600;
    z-index: 1;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="left">
    <h1>We buy cars for <span>cash.</span><br>Even damaged ones.</h1>
    <p class="subtext">Need money fast? We'll make you an offer and pay you today.</p>
    <div class="pills">
      <span class="pill">Cash same day</span>
      <span class="pill">We buy damaged cars</span>
      <span class="pill">Free to submit</span>
    </div>
  </div>
  <div class="right-side">
    <div class="right-big">24hrs</div>
    <div class="right-label">Offer turnaround</div>
  </div>
  <div class="website">www.nambuyer.com</div>
</div>
<button onclick="downloadDesign()" style="position:fixed;top:20px;right:20px;background:#3b82f6;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;z-index:999;">Download PNG</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
function downloadDesign(){
  const el = document.querySelector('.canvas');
  html2canvas(el, {scale:1, backgroundColor:null}).then(c => {
    const a = document.createElement('a');
    a.download = 'nambuyer-facebook-cover.png';
    a.href = c.toDataURL('image/png');
    a.click();
  });
}
</script>
</body>
</html>
