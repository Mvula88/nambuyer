<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #111; }
  .canvas {
    width: 1080px; height: 1080px;
    background: #0a0f1a;
    position: relative;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  /* Subtle gradient overlay */
  .canvas::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, rgba(59,130,246,0.08) 0%, transparent 50%, rgba(30,58,95,0.15) 100%);
  }
  /* Accent line left */
  .accent-line {
    position: absolute;
    left: 60px;
    top: 120px;
    bottom: 120px;
    width: 4px;
    background: #3b82f6;
    border-radius: 2px;
  }
  .content {
    position: relative;
    z-index: 1;
    padding: 100px 80px 80px 100px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .tag {
    display: inline-block;
    background: #3b82f6;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 8px 20px;
    border-radius: 4px;
    margin-bottom: 48px;
  }
  h1 {
    font-size: 88px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.05;
    letter-spacing: -2px;
  }
  h1 span {
    color: #3b82f6;
  }
  .subtext {
    font-size: 28px;
    color: rgba(255,255,255,0.45);
    margin-top: 32px;
    line-height: 1.5;
    max-width: 600px;
  }
  .divider {
    width: 80px;
    height: 3px;
    background: #C5A55A;
    margin-top: 40px;
    border-radius: 2px;
  }
  .bottom-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 32px 80px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .logo-area {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-mark {
    width: 36px;
    height: 36px;
    background: #3b82f6;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 14px;
    color: #fff;
  }
  .logo-text {
    font-size: 18px;
    font-weight: 800;
    color: #fff;
  }
  .logo-text span { color: #3b82f6; }
  .website {
    font-size: 15px;
    color: rgba(255,255,255,0.35);
    font-weight: 600;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="accent-line"></div>
  <div class="content">
    <div class="tag">NamBuyer</div>
    <h1>
      We buy cars<br>
      for <span>cash.</span>
    </h1>
    <p class="subtext">
      Need money fast? Car been in an accident?<br>
      We'll make you an offer and pay you today.
    </p>
    <div class="divider"></div>
  </div>
  <div class="bottom-bar">
    <div class="logo-area">
      <div class="logo-mark">NB</div>
      <div class="logo-text">Nam<span>Buyer</span></div>
    </div>
    <div class="website">www.nambuyer.com</div>
  </div>
</div>
<button onclick="downloadDesign()" style="position:fixed;top:20px;right:20px;background:#3b82f6;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;z-index:999;">Download PNG</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
function downloadDesign(){
  const el = document.querySelector('.canvas');
  html2canvas(el, {scale:1, backgroundColor:null}).then(c => {
    const a = document.createElement('a');
    a.download = 'nambuyer-instagram-post.png';
    a.href = c.toDataURL('image/png');
    a.click();
  });
}
</script>
</body>
</html>
