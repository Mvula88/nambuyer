<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NamBuyer — Design Studio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fafafa; color: #111; }

  /* Header */
  .header {
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header-logo {
    font-size: 18px;
    font-weight: 800;
    color: #111;
  }
  .header-logo span { color: #3b82f6; }
  .header-label {
    font-size: 14px;
    color: #3b82f6;
    font-weight: 600;
  }
  .header-right a {
    font-size: 13px;
    color: #666;
    text-decoration: none;
    font-weight: 500;
  }
  .header-right a:hover { color: #111; }

  /* Main */
  .main { max-width: 1200px; margin: 0 auto; padding: 48px 24px; }

  .title { text-align: center; margin-bottom: 40px; }
  .title h1 { font-size: 28px; font-weight: 800; color: #111; }
  .title p { color: #888; font-size: 14px; margin-top: 8px; }

  /* Size legend */
  .legend {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #888;
  }
  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  /* Filters */
  .filters {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 36px;
    flex-wrap: wrap;
  }
  .filter-btn {
    background: #fff;
    border: 1px solid #e5e7eb;
    color: #555;
    padding: 8px 20px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn:hover { border-color: #ccc; color: #111; }
  .filter-btn.active { background: #1e3a5f; border-color: #1e3a5f; color: #fff; }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px;
  }

  /* Card */
  .card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    overflow: hidden;
    transition: box-shadow 0.2s;
  }
  .card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); }

  .card-preview {
    width: 100%;
    aspect-ratio: 16/10;
    background: #0a0f1a;
    position: relative;
    overflow: hidden;
  }
  .card-preview iframe {
    width: 200%;
    height: 200%;
    border: none;
    transform: scale(0.5);
    transform-origin: top left;
    pointer-events: none;
  }
  .card-preview.square { aspect-ratio: 1/1; }
  .card-preview.story { aspect-ratio: 9/16; }
  .card-preview.cover { aspect-ratio: 820/312; }

  .card-body {
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-info h3 {
    font-size: 14px;
    font-weight: 700;
    color: #111;
  }
  .card-info p {
    font-size: 12px;
    color: #888;
    margin-top: 2px;
  }
  .card-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .badge-instagram { background: #dcfce7; color: #166534; }
  .badge-facebook { background: #dbeafe; color: #1e40af; }
  .badge-story { background: #fce7f3; color: #9d174d; }
  .badge-cover { background: #fef3c7; color: #92400e; }

  .card-actions {
    padding: 0 16px 16px;
    display: flex;
    gap: 8px;
  }
  .btn-open {
    flex: 1;
    background: #1e3a5f;
    color: #fff;
    border: none;
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    transition: background 0.15s;
  }
  .btn-open:hover { background: #163050; }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 80px 20px;
    color: #aaa;
    font-size: 14px;
    grid-column: 1 / -1;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-logo">Nam<span>Buyer</span></div>
    <div class="header-label">Design Studio</div>
  </div>
  <div class="header-right">
    <a href="../index.html">&larr; Back to site</a>
  </div>
</div>

<div class="main">
  <div class="title">
    <h1>Social Media Designs</h1>
    <p>Ready-to-use branded designs for your social media. Open any design, click Download PNG, and post.</p>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#166534"></div> Instagram Post: 1080x1080</div>
    <div class="legend-item"><div class="legend-dot" style="background:#92400e"></div> Facebook Cover: 820x312</div>
    <div class="legend-item"><div class="legend-dot" style="background:#9d174d"></div> Story/TikTok: 1080x1920</div>
    <div class="legend-item"><div class="legend-dot" style="background:#1e40af"></div> Facebook Post: 1200x630</div>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="filterDesigns('all')">All</button>
    <button class="filter-btn" onclick="filterDesigns('instagram')">Instagram</button>
    <button class="filter-btn" onclick="filterDesigns('facebook')">Facebook</button>
    <button class="filter-btn" onclick="filterDesigns('story')">Stories</button>
    <button class="filter-btn" onclick="filterDesigns('cover')">Covers</button>
  </div>

  <div class="grid" id="designGrid"></div>
</div>

<script>
const designs = [
  {
    title: "We Buy Cars For Cash",
    category: "instagram",
    file: "awareness-instagram-post.html",
    size: "1080x1080",
    badge: "Instagram",
    badgeClass: "badge-instagram",
    previewClass: "square",
  },
  {
    title: "Cash Same Day",
    category: "facebook",
    file: "awareness-facebook-post.html",
    size: "1200x630",
    badge: "Facebook",
    badgeClass: "badge-facebook",
    previewClass: "",
  },
  {
    title: "We Buy Cars For Cash",
    category: "story",
    file: "awareness-story.html",
    size: "1080x1920",
    badge: "Story/TikTok",
    badgeClass: "badge-story",
    previewClass: "story",
  },
  {
    title: "Awareness Cover",
    category: "cover",
    file: "awareness-facebook-cover.html",
    size: "820x312",
    badge: "FB Cover",
    badgeClass: "badge-cover",
    previewClass: "cover",
  },
  {
    title: "Profile Picture",
    category: "facebook",
    file: "facebook-profile-picture.html",
    size: "800x800",
    badge: "Profile",
    badgeClass: "badge-facebook",
    previewClass: "square",
  },
  {
    title: "Car Standing At Home?",
    category: "facebook",
    file: "post-1-unused-car.html",
    size: "1200x630",
    badge: "Facebook",
    badgeClass: "badge-facebook",
    previewClass: "",
  },
  {
    title: "Accident? No Insurance?",
    category: "facebook",
    file: "post-2-accident-car.html",
    size: "1200x630",
    badge: "Facebook",
    badgeClass: "badge-facebook",
    previewClass: "",
  },
  {
    title: "Short Before Month-End?",
    category: "facebook",
    file: "post-3-month-end.html",
    size: "1200x630",
    badge: "Facebook",
    badgeClass: "badge-facebook",
    previewClass: "",
  },
  {
    title: "We Buy Anywhere in Namibia",
    category: "facebook",
    file: "post-4-nationwide.html",
    size: "1200x630",
    badge: "Facebook",
    badgeClass: "badge-facebook",
    previewClass: "",
  },
  {
    title: "3 Easy Steps",
    category: "facebook",
    file: "post-5-how-it-works.html",
    size: "1200x630",
    badge: "Facebook",
    badgeClass: "badge-facebook",
    previewClass: "",
  },
];

function renderDesigns(filter) {
  const grid = document.getElementById('designGrid');
  const filtered = filter === 'all' ? designs : designs.filter(d => d.category === filter);

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty">No designs in this category yet.</div>';
    return;
  }

  grid.innerHTML = filtered.map(d => `
    <div class="card">
      <div class="card-preview ${d.previewClass}">
        <iframe src="${d.file}" loading="lazy"></iframe>
      </div>
      <div class="card-body">
        <div class="card-info">
          <h3>${d.title}</h3>
          <p>${d.size}</p>
        </div>
        <span class="card-badge ${d.badgeClass}">${d.badge}</span>
      </div>
      <div class="card-actions">
        <a href="${d.file}" target="_blank" class="btn-open">Open Full Size</a>
      </div>
    </div>
  `).join('');
}

function filterDesigns(cat) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderDesigns(cat);
}

renderDesigns('all');
</script>

</body>
</html>
