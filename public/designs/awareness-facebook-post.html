<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #111; }
  .canvas {
    width: 1200px; height: 630px;
    background: #0a0f1a;
    position: relative;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    display: flex;
  }
  /* Left content */
  .left {
    flex: 1;
    padding: 56px 60px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    z-index: 1;
  }
  /* Right accent panel */
  .right {
    width: 380px;
    background: #3b82f6;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 48px;
    position: relative;
  }
  .right::before {
    content: '';
    position: absolute;
    left: -60px;
    top: 0;
    bottom: 0;
    width: 60px;
    background: linear-gradient(to right, transparent, rgba(59,130,246,0.15));
  }
  .right-big {
    font-size: 72px;
    font-weight: 900;
    color: #fff;
    line-height: 1;
    letter-spacing: -2px;
  }
  .right-sub {
    font-size: 16px;
    color: rgba(255,255,255,0.7);
    margin-top: 16px;
    line-height: 1.5;
  }
  .tag {
    display: inline-block;
    border: 1px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.5);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: 4px;
    margin-bottom: 28px;
    width: fit-content;
  }
  h1 {
    font-size: 56px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.08;
    letter-spacing: -1.5px;
  }
  h1 span { color: #22d3ee; }
  .subtext {
    font-size: 18px;
    color: rgba(255,255,255,0.4);
    margin-top: 20px;
    line-height: 1.5;
    max-width: 440px;
  }
  .bottom-left {
    position: absolute;
    bottom: 28px;
    left: 60px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-mark {
    width: 30px; height: 30px;
    background: #3b82f6;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 11px;
    color: #fff;
  }
  .logo-text { font-size: 15px; font-weight: 800; color: #fff; }
  .logo-text span { color: #3b82f6; }
  .website {
    position: absolute;
    bottom: 28px;
    right: 380px;
    margin-right: 60px;
    font-size: 13px;
    color: rgba(255,255,255,0.25);
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="left">
    <div class="tag">NAMBUYER</div>
    <h1>
      We buy cars<br>
      for <span>cash.</span>
    </h1>
    <p class="subtext">
      Need money fast? Car been in an accident? We'll make you an offer and pay you today.
    </p>
  </div>
  <div class="right">
    <div class="right-big">Cash<br>Same<br>Day.</div>
    <div class="right-sub">No waiting. No runaround.<br>Accept and get paid.</div>
  </div>
  <div class="bottom-left">
    <div class="logo-mark">NB</div>
    <div class="logo-text">Nam<span>Buyer</span></div>
  </div>
  <div class="website">www.nambuyer.com</div>
</div>
<button onclick="downloadDesign()" style="position:fixed;top:20px;right:20px;background:#3b82f6;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;z-index:999;">Download PNG</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
function downloadDesign(){
  const el = document.querySelector('.canvas');
  html2canvas(el, {scale:1, backgroundColor:null}).then(c => {
    const a = document.createElement('a');
    a.download = 'nambuyer-facebook-post.png';
    a.href = c.toDataURL('image/png');
    a.click();
  });
}
</script>
</body>
</html>
