<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #111; }
  .canvas {
    width: 1200px; height: 630px;
    background: linear-gradient(135deg, #0a0f1a 0%, #1e3a5f 100%);
    position: relative;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  .content {
    position: relative; z-index: 1;
    padding: 52px 60px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .eyebrow {
    font-size: 13px;
    font-weight: 700;
    color: #C5A55A;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 54px;
    font-weight: 900;
    color: #fff;
    line-height: 1.1;
    letter-spacing: -1px;
    max-width: 750px;
  }
  h1 span { color: #22d3ee; }
  .body-text {
    font-size: 20px;
    color: rgba(255,255,255,0.45);
    margin-top: 20px;
    line-height: 1.5;
    max-width: 600px;
  }
  .highlights {
    display: flex;
    gap: 12px;
    margin-top: 28px;
  }
  .highlight {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 12px 22px;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
  }
  .highlight .icon { margin-right: 8px; }
  .bottom-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 20px 60px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .logo-img { height: 26px; width: auto; filter: brightness(0) invert(1); }
  .website { font-size: 13px; color: rgba(255,255,255,0.25); font-weight: 600; }
</style>
</head>
<body>
<div class="canvas">
  <div class="content">
    <div class="eyebrow">NamBuyer</div>
    <h1>Short before<br>month-end?<br><span>Sell your car today.</span></h1>
    <p class="body-text">Bills piling up? School fees due? Don't borrow money — sell your car to us and get cash in your hand the same day.</p>
    <div class="highlights">
      <div class="highlight"><span class="icon">💰</span>Cash same day</div>
      <div class="highlight"><span class="icon">📋</span>We handle paperwork</div>
      <div class="highlight"><span class="icon">🚗</span>We come to you</div>
    </div>
  </div>
  <div class="bottom-bar">
    <img src="/logo.png" class="logo-img" alt="NamBuyer">
    <div class="website">www.nambuyer.com</div>
  </div>
</div>
<button onclick="downloadDesign()" style="position:fixed;top:20px;right:20px;background:#3b82f6;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;z-index:999;">Download PNG</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
function downloadDesign(){
  html2canvas(document.querySelector('.canvas'), {scale:1, backgroundColor:null, useCORS:true}).then(c => {
    const a = document.createElement('a'); a.download = 'nambuyer-post-month-end.png'; a.href = c.toDataURL('image/png'); a.click();
  });
}
</script>
</body>
</html>
