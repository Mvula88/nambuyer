<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #111; }
  .canvas {
    width: 1080px; height: 1350px;
    background: linear-gradient(170deg, #0a0f1a 0%, #1e3a5f 100%);
    position: relative;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  .top {
    padding: 64px 72px 0;
  }
  .logo-img { height: 48px; width: auto; filter: brightness(0) invert(1); }
  .middle {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 72px;
  }
  h1 {
    font-size: 96px;
    font-weight: 900;
    color: #fff;
    line-height: 1.05;
    letter-spacing: -3px;
  }
  .highlight { color: #C5A55A; }
  .body-text {
    font-size: 36px;
    color: rgba(255,255,255,0.5);
    margin-top: 40px;
    line-height: 1.45;
    max-width: 850px;
  }
  .divider {
    width: 100px;
    height: 4px;
    background: #C5A55A;
    border-radius: 2px;
    margin-top: 48px;
  }
  .stat {
    margin-top: 40px;
  }
  .stat-number {
    font-size: 72px;
    font-weight: 900;
    color: #3b82f6;
    line-height: 1;
  }
  .stat-label {
    font-size: 28px;
    color: rgba(255,255,255,0.4);
    font-weight: 600;
    margin-top: 8px;
  }
  .bottom {
    padding: 0 72px 64px;
  }
  .cta {
    display: inline-block;
    background: #C5A55A;
    color: #0a0f1a;
    font-size: 32px;
    font-weight: 800;
    padding: 28px 56px;
    border-radius: 16px;
  }
  .website {
    font-size: 28px;
    color: rgba(255,255,255,0.25);
    font-weight: 600;
    margin-top: 32px;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="top">
    <img src="/logo.png" class="logo-img" alt="NamBuyer">
  </div>
  <div class="middle">
    <h1>Short before<br>month-end?<br><span class="highlight">Sell your car.</span></h1>
    <p class="body-text">Bills piling up? School fees due? Don't borrow — sell your car and get cash in your hand today.</p>
    <div class="divider"></div>
    <div class="stat">
      <div class="stat-number">24hrs</div>
      <div class="stat-label">From submission to cash in hand</div>
    </div>
  </div>
  <div class="bottom">
    <div class="cta">Get Your Offer Now</div>
    <div class="website">www.nambuyer.com</div>
  </div>
</div>
<button onclick="downloadDesign()" style="position:fixed;top:20px;right:20px;background:#3b82f6;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;z-index:999;">Download PNG</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>function downloadDesign(){html2canvas(document.querySelector('.canvas'),{scale:1,backgroundColor:null,useCORS:true}).then(c=>{const a=document.createElement('a');a.download='nambuyer-post-month-end.png';a.href=c.toDataURL('image/png');a.click();});}</script>
</body>
</html>
