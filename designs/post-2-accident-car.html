<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #111; }
  .canvas {
    width: 1080px; height: 1350px;
    background: #0a0f1a;
    position: relative;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  .top {
    padding: 64px 72px 0;
  }
  .logo-img { height: 80px; width: auto; filter: brightness(0) invert(1); }
  .middle {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 72px;
  }
  h1 {
    font-size: 92px;
    font-weight: 900;
    color: #fff;
    line-height: 1.05;
    letter-spacing: -3px;
  }
  .highlight { color: #22d3ee; }
  .body-text {
    font-size: 36px;
    color: rgba(255,255,255,0.5);
    margin-top: 40px;
    line-height: 1.45;
    max-width: 850px;
  }
  .tags {
    display: flex;
    gap: 16px;
    margin-top: 48px;
    flex-wrap: wrap;
  }
  .tag {
    background: rgba(34,211,238,0.1);
    border: 2px solid rgba(34,211,238,0.25);
    color: #22d3ee;
    font-size: 26px;
    font-weight: 700;
    padding: 16px 32px;
    border-radius: 12px;
  }
  .bottom {
    padding: 0 72px 64px;
  }
  .cta {
    display: inline-block;
    background: #3b82f6;
    color: #fff;
    font-size: 32px;
    font-weight: 800;
    padding: 28px 56px;
    border-radius: 16px;
  }
  .website {
    font-size: 28px;
    color: rgba(255,255,255,0.25);
    font-weight: 600;
    margin-top: 32px;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="top">
    <img src="/logo.png" class="logo-img" alt="NamBuyer">
  </div>
  <div class="middle">
    <h1>Car accident?<br>No insurance?<br><span class="highlight">Don't stress.</span></h1>
    <p class="body-text">We buy accident damaged cars — running or not. No need to fix it. We come to you and pay cash.</p>
    <div class="tags">
      <div class="tag">No repairs needed</div>
      <div class="tag">No insurance needed</div>
      <div class="tag">Cash same day</div>
    </div>
  </div>
  <div class="bottom">
    <div class="cta">Submit Your Car</div>
    <div class="website">www.nambuyer.com</div>
  </div>
</div>
<button onclick="downloadDesign()" style="position:fixed;top:20px;right:20px;background:#3b82f6;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;z-index:999;">Download PNG</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>function downloadDesign(){html2canvas(document.querySelector('.canvas'),{scale:1,backgroundColor:null,useCORS:true}).then(c=>{const a=document.createElement('a');a.download='nambuyer-post-accident-car.png';a.href=c.toDataURL('image/png');a.click();});}</script>
</body>
</html>
