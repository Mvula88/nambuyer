<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #111; }
  .canvas {
    width: 1080px; height: 1920px;
    background: #0a0f1a;
    position: relative;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  /* Top gradient accent */
  .canvas::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 400px;
    background: linear-gradient(180deg, rgba(59,130,246,0.12) 0%, transparent 100%);
  }
  .top-section {
    flex: 0 0 auto;
    padding: 80px 64px 0;
    position: relative;
    z-index: 1;
  }
  .tag {
    display: inline-block;
    background: #3b82f6;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 10px 24px;
    border-radius: 6px;
  }
  .middle {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 64px;
    position: relative;
    z-index: 1;
  }
  h1 {
    font-size: 110px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.0;
    letter-spacing: -3px;
  }
  h1 span { color: #3b82f6; }
  .subtext {
    font-size: 36px;
    color: rgba(255,255,255,0.4);
    margin-top: 40px;
    line-height: 1.45;
    max-width: 800px;
  }
  /* Accent blocks */
  .blocks {
    margin-top: 64px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .block {
    display: inline-block;
    background: rgba(59,130,246,0.12);
    border: 1px solid rgba(59,130,246,0.2);
    color: #fff;
    padding: 20px 32px;
    border-radius: 12px;
    font-size: 28px;
    font-weight: 700;
    width: fit-content;
  }
  .block .dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    background: #3b82f6;
    border-radius: 50%;
    margin-right: 16px;
  }
  .bottom-section {
    flex: 0 0 auto;
    padding: 0 64px 72px;
    position: relative;
    z-index: 1;
  }
  .cta-btn {
    display: inline-block;
    background: #3b82f6;
    color: #fff;
    font-size: 28px;
    font-weight: 800;
    padding: 24px 56px;
    border-radius: 14px;
    letter-spacing: 0.5px;
  }
  .bottom-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 40px;
  }
  .logo-area {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .logo-img {
    height: 40px;
    width: auto;
    filter: brightness(0) invert(1);
  }
  .website {
    font-size: 20px;
    color: rgba(255,255,255,0.3);
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="top-section">
    <div class="tag">NAMBUYER</div>
  </div>
  <div class="middle">
    <h1>We buy<br>cars for<br><span>cash.</span></h1>
    <p class="subtext">
      Need money fast?<br>
      Car been in an accident?<br>
      We'll pay you today.
    </p>
    <div class="blocks">
      <div class="block"><span class="dot"></span>Cash same day</div>
      <div class="block"><span class="dot"></span>We buy damaged cars</div>
      <div class="block"><span class="dot"></span>Free to submit</div>
    </div>
  </div>
  <div class="bottom-section">
    <div class="cta-btn">Sell Your Car Now</div>
    <div class="bottom-bar">
      <div class="logo-area">
        <img src="../public/logo.png" class="logo-img" alt="NamBuyer">
      </div>
      <div class="website">www.nambuyer.com</div>
    </div>
  </div>
</div>
<button onclick="downloadDesign()" style="position:fixed;top:20px;right:20px;background:#3b82f6;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;z-index:999;">Download PNG</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
function downloadDesign(){
  const el = document.querySelector('.canvas');
  html2canvas(el, {scale:1, backgroundColor:null}).then(c => {
    const a = document.createElement('a');
    a.download = 'nambuyer-story.png';
    a.href = c.toDataURL('image/png');
    a.click();
  });
}
</script>
</body>
</html>
